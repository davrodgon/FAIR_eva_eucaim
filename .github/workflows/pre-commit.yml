name: pre-commit

on:
  pull_request:
  push:
    # main, the integration branch of the fork and CI work
    branches: [main, "fork/**", "ci/**"]
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: pre-commit/action@v3.0.1
