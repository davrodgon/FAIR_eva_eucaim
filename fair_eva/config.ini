[Generic]
# Relative path to the API config file
api_config = fair-api.yaml

[fairsharing]
# username and password
username = ['']
password = ['']
# static files
metadata_path = ['static/fairsharing_metadata_standards20240214.json']
formats_path = ['static/fairsharing_formats20240226.txt']

[internet media types]
#path to internet media files file
path = ['static/internetmediatypes190224.csv']

# >>> FTR (FAIR Testing Resource vocabulary, OSTrails) -- see docs/ftr_ostrails.md
# All values below are PROVISIONAL placeholders. Persistent identifiers, licences and
# contact data are decisions of whoever deploys FAIR EVA: set them before publishing
# FTR descriptions or results anywhere.
[ftr]
# Base IRI of every resource FAIR EVA describes: {base_uri}/test/{plugin}/{indicator},
# {base_uri}/metric/{indicator}, {base_uri}/result/{uuid}, ...
base_uri = https://example.org/PROVISIONAL/fair-eva
# URL where the FTR API is served (dcat:endpointURL of the tests). Empty: taken from the
# HTTP request.
endpoint_base_url =
# Licence of the tests (exactly one IRI is required by the FTR shapes) and of the results.
test_license = https://www.apache.org/licenses/LICENSE-2.0
result_license = http://creativecommons.org/licenses/by/4.0/
# Contact point (required). contact_type: organization | individual. Empty uri: {base_uri}/contact
contact_type = organization
contact_uri =
contact_name = PROVISIONAL contact: set [ftr] contact_name in config.ini
contact_email =
# Optional publisher / creator of the tests (same keys: *_type, *_uri, *_name, *_email)
publisher_name =
creator_name =
# Software repository of the tests and tool that supports them (empty: the repository)
code_repository = https://github.com/IFCA-Advanced-Computing/FAIR_eva
tool_uri =
# Types of digital object the tests apply to (IRIs separated by spaces, optional).
# Can be overridden per plugin in the [ftr] section of the plugin's config.ini.
applicable_for =
