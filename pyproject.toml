[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"

[project]
name = "fair_eva"
version = "1.5.0"
authors = [
  { name="Fernando Aguilar Gómez", email="aguilarf@ifca.unican.es" },
  { name="Pablo Orviz Fernández", email="orviz@ifca.unican.es" },
  { name="Iván Palomo Llavona", email="palomo@ifca.unican.es" },
]
description = "FAIR EVA: Evaluator, Validator & Advisor"
readme = "README.md"
requires-python = ">=3.6"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache License 2.0",
    "Operating System :: OS Independent",
]

dependencies = [
    "werkzeug==3.0.3",
    "connexion[flask,uvicorn]",
    "swagger-ui-bundle==0.0.6",
    "flask==2.2.5",
    "flask_wtf",
    "bs4",
    "psycopg2-binary",
    "pandas",
    "idutils",
    "Babel",
    "flask_babel",
    "reportlab",
    # imported by fair_eva/web.py, fair_eva/utils/*.py
    "bokeh>=3",
    "numpy",
    "rdflib",
    "pyshacl>=0.26",
    "requests",
    "PyPDF2",
]

[project.scripts]
fair-eva = "fair_eva.__main__:main"

[project.urls]
"Homepage" = "https://github.com/ifca-advanced-computing/FAIR_eva"
"Bug Tracker" = "https://github.com/ifca-advanced-computing/FAIR_eva/issues"

[tool.setuptools.package-data]
"fair_eva" = ["*.ini"]

[tool.docformatter]
black = true
recursive = true
non-strict = false
in-place = true

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["fair_eva/tests"]

[tool.coverage.run]
source = ["fair_eva"]
omit = ["fair_eva/tests/*", "fair_eva/plugins.old/*"]

[tool.coverage.report]
# Floor measured at introduction; raise it as coverage grows
fail_under = 40
show_missing = true
skip_covered = true
